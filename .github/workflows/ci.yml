name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      EVENTPIPE_KAFKA_BOOTSTRAP_SERVERS: localhost:59092
      TRANSFORM_INTEGRATION: "1"
      TRANSFORM_KAFKA_BOOTSTRAP_SERVERS: localhost:59092
      TRANSFORM_DATABASE_URL: postgresql+asyncpg://eventpipe:local-test-only@localhost:55435/eventpipe_test
      TRANSFORM_S3_ENDPOINT_URL: http://127.0.0.1:39000
      TRANSFORM_S3_ACCESS_KEY: verification
      TRANSFORM_S3_SECRET_KEY: local-test-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r ingest_service/requirements.txt
          pip install -r transform_service/requirements.txt
          pip install -r query_service/requirements.txt

      - name: Lint
        run: python -m ruff check ingest_service transform_service query_service scripts

      - name: Start test infrastructure
        run: docker compose -p eventpipe-ci -f docker-compose.test.yml up -d --wait --wait-timeout 240 kafka postgres seaweedfs

      - name: Test
        run: |
          python -m pytest -q --junitxml=.pytest_cache/ci.xml
          python -c "import xml.etree.ElementTree as E; assert not E.parse('.pytest_cache/ci.xml').findall('.//skipped'), 'Integration tests must not be skipped'"

      - name: Docker build
        run: |
          docker build -f ingest_service/Dockerfile .
          docker build -f transform_service/Dockerfile .
          docker build -f query_service/Dockerfile .

      - name: Stop test infrastructure
        if: always()
        run: docker compose -p eventpipe-ci -f docker-compose.test.yml down